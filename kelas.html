<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>Presensi Kelas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111827;--mu:#6b7280;--pr:#0f766e;--bd:#e5e7eb;--ok:#15803d;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--ok:#86efac;--er:#fca5a5}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:760px;margin:auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:2px 0 8px}
.b{font:inherit;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}
.s{font:inherit;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.srow b{font-family:var(--serif,Georgia,serif);font-size:16px}
.tg{width:46px;height:46px;border-radius:50%;border:2px solid;font-size:24px;font-weight:700;background:none;flex:none;pointer-events:none}
.srow.h .tg{color:var(--ok);border-color:var(--ok)}
.srow.t .tg{color:var(--er);border-color:var(--er)}
.srow.t{background:rgba(220,38,38,.08)}
.pl{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-top:2px}
.pl.ok{background:rgba(34,197,94,.18);color:var(--ok)}.pl.wn{background:rgba(234,179,8,.22);color:#ca8a04}.pl.in{background:rgba(59,130,246,.18);color:#2563eb}
.bar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--ak,var(--bd));padding:10px 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.5);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.okc{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.45);border-radius:10px;padding:10px;margin:8px 0}
.kt{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.kt button{font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.kt button.on{background:var(--er);color:#fff;border-color:var(--er)}
.riw{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style>
<link rel="stylesheet" href="tema.css">
<script src="config.js"></script>
<script src="tema.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let API=window.PRESENSI_API||localStorage.getItem('api')||'',tok=sessionStorage.getItem('tok')||'',me=JSON.parse(sessionStorage.getItem('me')||'null');
const dev=(navigator.userAgent.match(/\(([^)]+)\)/)||[,''])[1].slice(0,60);
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--er)':'';t.style.color=bad?'#fff':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3800)}
async function api(a,d={}){
  if(!API)throw new Error('URL API belum diisi');
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:tok,dev,...d})}),j=await r.json();
  if(j.err==='SESI'){keluar(true);throw new Error('Sesi berakhir, silakan login lagi')}
  if(!j.ok)throw new Error(j.err||'Gagal');return j;
}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message,1)}};
const V=h=>$('#v').innerHTML=h;

/* Login */
function drawLogin(){location.replace('index.html?m=sesi')} // login terpusat di index.html
async function keluar(diam){if(!diam&&tok)try{await api('logout')}catch(e){}tok='';me=null;sessionStorage.clear();drawLogin()}

/* Aplikasi */
let KL=[],KP=[],S={jenis:'Reguler',ref:'',jam:1,mapel:'',data:null,tidak:{}};
async function app(){
  if(!['Guru','Admin'].includes(me.peran)){location.replace('index.html');return}
  $('#app').innerHTML=`<header class="hd"><div class="brand">${brandLogo(46)}<div><div class="nm">${esc(TEMA.nama)}</div><div class="sl">Presensi Kelas</div></div></div><div class="btns"><span class="mu">${esc(me.nama)}</span>${me.peran==='Admin'?'<a class="s" href="admin.html">Admin</a>':''}<button class="s" id="pw">Ganti password</button><button class="s" id="out">Keluar</button></div></header><div id="v"><div class="mu">Memuat...</div></div>`;
  $('#out').onclick=()=>keluar();
  $('#pw').onclick=()=>gantiPassword(api,toast,me.peran);
  const [k,p]=await Promise.all([api('kelas_list'),api('kelompok_list')]);
  KL=k.v.filter(x=>x.Status!=='Nonaktif');KP=p.v.filter(x=>x.Status==='Aktif');
  form();
}
function form(){
  const pil=S.jenis==='Pilihan';
  const op=pil?KP.map(k=>`<option value="${esc(k.ID)}" data-m="${esc(k.Mapel)}">${esc(k.Nama)} (${k.Anggota} siswa)</option>`):KL.map(k=>`<option value="${esc(k.ID_Kelas)}">${esc(k.Nama_Kelas||k.ID_Kelas)}</option>`);
  const lj=Number(localStorage.getItem('lastJam')||0),jam=Math.min(12,lj+1||1);
  V(`<div class="card"><b>Presensi Kelas</b>
  <div class="seg"><button data-j="Reguler" class="${pil?'':'on'}">Kelas reguler</button><button data-j="Pilihan" class="${pil?'on':''}">Kelas mapel pilihan</button></div>
  <label class="mu">${pil?'Kelompok':'Kelas'}</label><select id="fR">${op.join('')||'<option value="">Belum ada data</option>'}</select>
  <label class="mu">Mata pelajaran</label><input id="fM" list="dlM" autocomplete="off" placeholder="mis. Matematika"><datalist id="dlM"></datalist>
  <label class="mu">Jam pelajaran ke-</label><select id="fJ">${[...Array(12)].map((_,i)=>`<option ${i+1===jam?'selected':''}>${i+1}</option>`).join('')}</select>
  <button class="b" id="fGo" style="width:100%">Tampilkan daftar siswa</button>
  ${pil&&!KP.length?'<div class="mu" style="margin-top:8px">Belum ada kelas pilihan atas nama Anda. Minta admin mengimpor data kelompok.</div>':''}</div>
  <div id="rw"></div><div class="card"><b>Presensi saya hari ini</b><div id="rh" class="mu">Memuat...</div></div>`);
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.jenis=b.dataset.j;form()});
  const isiMapel=()=>{const o=$('#fR').selectedOptions[0];if(pil&&o)$('#fM').value=o.dataset.m||''};
  $('#fR').onchange=isiMapel;isiMapel();
  $('#fGo').onclick=run(buka);
  riwayat();
}
async function buka(){
  S.ref=$('#fR').value;S.jam=Number($('#fJ').value);S.mapel=$('#fM').value.trim();
  if(!S.ref)return toast('Pilih kelas atau kelompok dulu',1);
  const d=await api('kelas_siswa',{jenis:S.jenis,ref:S.ref});S.data=d;
  $('#dlM').innerHTML=d.saranMapel.map(m=>`<option value="${esc(m)}">`).join('');
  const ada=d.sesi.find(x=>x.jam===S.jam);S.tidak={};S.lain=null;
  if(ada){Object.assign(S.tidak,Array.isArray(ada.tidak)?Object.fromEntries(ada.tidak.map(n=>[n,'Tanpa keterangan'])):ada.tidak);if(!S.mapel)S.mapel=ada.mapel;if(me.peran==='Guru'&&ada.nip!==me.nip)S.lain=ada.guru}
  else d.siswa.forEach(s=>{if(s.g.izin)S.tidak[s.nis]=s.g.izin}); // siswa yang sudah tercatat sakit/izin ditandai tidak hadir lebih dulu
  if(!S.mapel&&d.mapel)S.mapel=d.mapel;
  $('#fM').value=S.mapel;daftar(!!ada);
  $('#rw').scrollIntoView({behavior:'smooth',block:'start'});
}
function badge(g){
  if(g.izin)return`<span class="pl in">${esc(g.izin)}</span>`;
  if(g.masuk)return`<span class="pl ok">Gerbang ${esc(g.masuk)}${g.pulang?' • pulang '+esc(g.pulang):''}</span>`;
  return'<span class="pl wn">Belum scan gerbang</span>';
}
const KT=['Tanpa keterangan','Sakit','Izin'];
const baris=s=>{const k=S.tidak[s.nis],gb=s.g&&s.g.masuk&&!s.g.pulang;
  return `<div class="srow ${k?'t':'h'}" data-n="${esc(s.nis)}"><div><b>${esc(s.nama)}</b><div class="mu">NIS ${esc(s.nis)}${s.kelas&&S.jenis==='Pilihan'?' • '+esc(s.kelas):''}</div>${badge(s.g)}${k?`<div class="kt">${gb?'<span class="mu" style="width:100%">⚠ Sudah scan di gerbang. Pilih keterangan:</span>':''}${KT.map(x=>`<button data-k="${x}" class="${x===k?'on':''}">${x}</button>`).join('')}</div>`:''}</div><button class="tg" tabindex="-1">${k?'✗':'✓'}</button></div>`};
function hitung(){const n=S.data.siswa.length,t=S.data.siswa.filter(s=>S.tidak[s.nis]).length;$('#cnt').innerHTML=`<b>Hadir ${n-t}</b> • <span style="color:var(--er)">Tidak hadir ${t}</span> <span class="mu">dari ${n}</span>`}
function daftar(sudahAda){
  const d=S.data;
  $('#rw').innerHTML=`<div class="card"><b>${esc(d.label)}</b> <span class="mu">jam ke-${S.jam} • ${esc(S.mapel)} • ${d.siswa.length} siswa</span>
  ${S.lain?`<div class="warn">Sesi ini sudah diisi oleh <b>${esc(S.lain)}</b>. Anda tidak bisa mengubahnya; hubungi admin bila perlu koreksi.</div>`:''}
  ${sudahAda&&!S.lain?'<div class="warn">Presensi jam ini sudah pernah dikirim. Mengirim lagi akan <b>menggantikan</b> isi sebelumnya.</div>':''}
  <div class="mu">Ketuk nama untuk mengubah ✓ (hadir) menjadi ✗ (tidak hadir), lalu pilih keterangannya: Tanpa keterangan, Sakit, atau Izin. Siswa yang tercatat sakit/izin sudah ditandai ✗.</div>
  <div id="sl">${d.siswa.map(baris).join('')||'<div class="mu" style="padding:12px 0">Daftar siswa kosong.</div>'}</div>
  <div class="bar"><span id="cnt"></span><span style="flex:1"></span><button class="s" id="sAll">Semua hadir</button><button class="b" id="sKirim" ${S.lain?'disabled':''}>Kirim presensi</button></div></div>`;
  hitung();
  $('#sl').onclick=e=>{const r=e.target.closest('.srow');if(!r)return;const n=r.dataset.n,s=S.data.siswa.find(x=>x.nis===n),kb=e.target.closest('.kt button');
    if(kb)S.tidak[n]=kb.dataset.k;
    else if(S.tidak[n])delete S.tidak[n];
    else S.tidak[n]=s.g.izin||'Tanpa keterangan';
    r.outerHTML=baris(s);hitung()};
  $('#sAll').onclick=()=>{S.tidak={};daftar(sudahAda)};
  $('#sKirim').onclick=run(kirim);
}
async function kirim(){
  S.mapel=($('#fM')&&$('#fM').value.trim())||S.mapel;
  if(S.mapel.length<2)return toast('Isi mata pelajaran dulu',1);
  const t=Object.keys(S.tidak);
  $('#sKirim').disabled=true;
  try{
    const r=await api('kelas_simpan',{jenis:S.jenis,ref:S.ref,jam:S.jam,mapel:S.mapel,tidak:t});
    localStorage.setItem('lastJam',S.jam);
    const dft=(L,j)=>L.map(x=>`<li>${esc(x.nama)} (${esc(x.kelas)})${j?' • gerbang '+esc(x.jam)+' • '+esc(x.ket||'Tanpa keterangan'):''}</li>`).join('');
    $('#rw').innerHTML=`<div class="card"><div class="okc"><b>Tersimpan.</b> ${esc(S.data.label)} • jam ke-${S.jam} • ${esc(S.mapel)}<br>Hadir <b>${r.hadir}</b> • Tidak hadir <b>${r.tidak}</b> dari ${r.jumlah}${r.diperbarui?' <span class="mu">(menggantikan isian sebelumnya)</span>':''}</div>
    ${r.belumGerbang.length?`<div class="warn"><b>Ada di kelas tetapi belum scan di gerbang:</b><ul>${dft(r.belumGerbang)}</ul>Mohon informasikan ke petugas gerbang.</div>`:''}
    ${r.gerbangTidakAda.length?`<div class="warn"><b>Sudah scan di gerbang tetapi tidak ada di kelas:</b><ul>${dft(r.gerbangTidakAda,1)}</ul>Mohon informasikan ke petugas gerbang atau wali kelas.</div>`:''}
    <button class="b" id="lain">Isi kelas lain</button></div>`;
    $('#lain').onclick=()=>{S.data=null;form();scrollTo(0,0)};
    riwayat();
  }catch(e){toast(e.message,1);if($('#sKirim'))$('#sKirim').disabled=false}
}
let RW=[];
async function riwayat(){
  try{
    const t=new Date().toLocaleDateString('sv-SE'),r=await api('kelas_sesi_list',{dari:t,sampai:t});RW=r.v.sort((a,b)=>a.jam-b.jam);
    $('#rh').innerHTML=RW.map((x,i)=>`<div class="riw"><div><b>Jam ${x.jam}</b> • ${esc(x.kelas)} • ${esc(x.mapel)}<div class="mu">Hadir ${x.hadir}/${x.jumlah}${x.guru&&me.peran==='Admin'?' • '+esc(x.guru):''}</div></div><button class="s" data-i="${i}">Buka</button></div>`).join('')||'Belum ada presensi kelas hari ini.';
    $('#rh').onclick=run(async e=>{const i=e.target.dataset.i;if(i==null)return;const x=RW[i];S.jenis=x.jenis;form();
      await new Promise(r=>setTimeout(r,30));$('#fR').value=x.ref;$('#fM').value=x.mapel;$('#fJ').value=x.jam;await buka()});
  }catch(e){if($('#rh'))$('#rh').textContent='Tidak dapat memuat: '+e.message}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
me&&tok?app().catch(e=>toast(e.message,1)):drawLogin();
</script>
</body>
</html>
