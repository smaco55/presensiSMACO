<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>Presensi Sekolah</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111827;--mu:#6b7280;--pr:#0f766e;--bd:#e5e7eb;--er:#b91c1c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:820px;margin:auto;padding:12px}
.mu{color:var(--mu);font-size:13px}
input{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:2px 0 8px}
.b{font:inherit;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--er);color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
.pd{font-size:12px;color:var(--mu);margin:0 0 12px;min-height:16px}
select{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:2px 0 6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.roles button{text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.roles button b{display:block;font-family:var(--serif,Georgia,serif);font-size:15px}
.roles button span{font-size:12px;color:var(--mu)}
.roles button.on{border-color:var(--pr);background:var(--pr-s,#e6f4f1);box-shadow:0 0 0 2px var(--pr) inset}
.pesan{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.5);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
</style>
<link rel="stylesheet" href="tema.css">
<script src="config.js"></script>
<script src="tema.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let API=window.PRESENSI_API||localStorage.getItem('api')||'';
const dev=(navigator.userAgent.match(/\(([^)]+)\)/)||[,''])[1].slice(0,60);

/* hak akses yang bisa dipilih -> halaman tujuan -> peran akun yang diizinkan */
const ROLES=[
  ['admin','Admin','Pengelola sistem','admin.html',['Admin']],
  ['guru','Guru','Presensi kelas','kelas.html',['Guru','Admin']],
  ['petugas','Petugas Presensi','Presensi di gerbang','presensi.html',['Petugas','Admin']],
  ['wali','Wali Kelas','Memantau kelas sendiri','admin.html',['Wali']],
  ['bk','BK (Bimbingan Konseling)','Memantau semua kelas','admin.html',['BK']]
];
const HALAMAN={Admin:'admin.html',Guru:'kelas.html',Petugas:'presensi.html',Wali:'admin.html',BK:'admin.html'};
const NAMA={Admin:'Admin',Guru:'Guru',Petugas:'Petugas Presensi',Wali:'Wali Kelas',BK:'BK'};

/* sudah login? langsung ke halaman sesuai hak akses */
const tok0=sessionStorage.getItem('tok'),me0=JSON.parse(sessionStorage.getItem('me')||'null');
if(tok0&&me0&&HALAMAN[me0.peran]&&!/pilih/.test(location.search))location.replace(HALAMAN[me0.peran]);

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)}
let sel=localStorage.getItem('peran')||'guru';
const q=new URLSearchParams(location.search);

function gambar(){
  if(!ROLES.some(r=>r[0]===sel))sel='guru';
  $('#app').innerHTML=`<div id="login"><div class="lg"><div class="lg-brand">${brandLogo(84)}<h1>${esc(TEMA.nama)}</h1><div class="ln"></div><p>${esc(TEMA.slogan)}</p></div>
  <div class="lg-form"><h2 style="margin:0 0 4px;font-size:21px">Masuk</h2><div class="mu">Masukkan akun Anda, lalu pilih hak akses</div>
  ${q.get('m')==='sesi'?'<div class="pesan">Sesi berakhir atau Anda belum masuk. Silakan masuk lagi.</div>':''}<br>
  ${window.PRESENSI_API?'':`<input id="lApi" placeholder="URL API (Apps Script)" value="${esc(API)}">`}
  <input id="lU" placeholder="Username" autocomplete="username" autocapitalize="none"><input id="lP" type="password" placeholder="Password" autocomplete="current-password">
  <label class="mu" for="lR" style="display:block;margin-top:2px">Hak akses</label>
  <select id="lR">${ROLES.map(r=>`<option value="${r[0]}" ${r[0]===sel?'selected':''}>${r[1]}</option>`).join('')}</select>
  <div class="pd" id="lD"></div>
  <button class="b" style="width:100%" id="lGo">Masuk</button></div></div></div>`;
  const desk=()=>{$('#lD').textContent=ROLES.find(r=>r[0]===sel)[2]};desk();
  $('#lR').onchange=()=>{sel=$('#lR').value;localStorage.setItem('peran',sel);desk()};
  $('#lU').onkeydown=e=>{if(e.key==='Enter')$('#lP').focus()};
  $('#lP').onkeydown=e=>{if(e.key==='Enter')$('#lGo').click()};
  $('#lGo').onclick=masuk;
}
async function panggil(a,d,tok){
  if(!API)throw new Error('URL API belum diisi');
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:tok||'',dev,...d})}),j=await r.json();
  if(!j.ok)throw new Error(j.err||'Gagal');return j;
}
async function masuk(){
  const btn=$('#lGo');btn.disabled=true;btn.textContent='Memeriksa...';
  try{
    if(!window.PRESENSI_API){API=$('#lApi').value.trim();localStorage.setItem('api',API)}
    const pilih=ROLES.find(r=>r[0]===sel),r=await panggil('login',{u:$('#lU').value,p:$('#lP').value});
    if(pilih[4].indexOf(r.u.peran)<0){ // salah memilih hak akses: batalkan sesi, beri tahu yang benar
      try{await panggil('logout',{},r.t)}catch(e){}
      throw new Error('Akun ini terdaftar sebagai '+NAMA[r.u.peran]+'. Silakan pilih hak akses "'+NAMA[r.u.peran]+'".');
    }
    sessionStorage.setItem('tok',r.t);sessionStorage.setItem('me',JSON.stringify(r.u));
    if(r.awal)sessionStorage.setItem('awal','1');
    location.href=pilih[3];
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Masuk'}
}
gambar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
